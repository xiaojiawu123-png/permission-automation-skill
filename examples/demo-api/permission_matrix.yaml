# permission_matrix.yaml — Demo: Test Scenario Matrix
#
# This is a FICTIONAL example.
# Each entry maps to one or more test cases.
#
# RESPONSIBILITY: Defines testable permission scenarios.
#   References users from users.yaml and resources from permissions.yaml.

matrix:

  # ===========================================================================
  # Authentication Tests
  # ===========================================================================

  - category: authentication
    description: "No token — list employees"
    api: GET /api/employees
    expected: deny
    expected_status: 401

  - category: authentication
    description: "Invalid token — list employees"
    api: GET /api/employees
    token_override: "this_is_not_a_valid_token"
    expected: deny
    expected_status: 401

  - category: authentication
    description: "Expired token — list employees"
    api: GET /api/employees
    token_override: "${EXPIRED_TOKEN}"
    expected: deny
    expected_status: 401

  - category: authentication
    description: "No token — get single employee"
    api: GET /api/employees/{employee_id}
    expected: deny
    expected_status: 401

  - category: authentication
    description: "No token — create employee"
    api: POST /api/employees
    expected: deny
    expected_status: 401

  - category: authentication
    description: "No token — delete employee"
    api: DELETE /api/employees/{employee_id}
    expected: deny
    expected_status: 401

  # ===========================================================================
  # Role Permission Tests — Admin (positive: should allow all)
  # ===========================================================================

  - category: role_permission
    role: admin
    resource: employee
    operation: query
    api: GET /api/employees
    expected: allow

  - category: role_permission
    role: admin
    resource: employee
    operation: query
    api: GET /api/employees/{employee_id}
    expected: allow

  - category: role_permission
    role: admin
    resource: employee
    operation: create
    api: POST /api/employees
    expected: allow

  - category: role_permission
    role: admin
    resource: employee
    operation: update
    api: PUT /api/employees/{employee_id}
    expected: allow

  - category: role_permission
    role: admin
    resource: employee
    operation: delete
    api: DELETE /api/employees/{employee_id}
    expected: allow

  # ===========================================================================
  # Role Permission Tests — Manager (positive: query, create, update)
  # ===========================================================================

  - category: role_permission
    role: manager
    resource: employee
    operation: query
    api: GET /api/employees
    expected: allow
    data_scope: department

  - category: role_permission
    role: manager
    resource: employee
    operation: create
    api: POST /api/employees
    expected: allow

  - category: role_permission
    role: manager
    resource: employee
    operation: update
    api: PUT /api/employees/{employee_id}
    expected: allow
    data_scope: department

  # ===========================================================================
  # Role Permission Tests — Manager (negative: cannot delete)
  # ===========================================================================

  - category: role_permission
    role: manager
    resource: employee
    operation: delete
    api: DELETE /api/employees/{employee_id}
    expected: deny
    expected_status: 403

  # ===========================================================================
  # Role Permission Tests — Employee (negative: cannot create, delete, list)
  # ===========================================================================

  - category: role_permission
    role: employee
    resource: employee
    operation: query
    api: GET /api/employees
    expected: deny
    expected_status: 403

  - category: role_permission
    role: employee
    resource: employee
    operation: create
    api: POST /api/employees
    expected: deny
    expected_status: 403

  - category: role_permission
    role: employee
    resource: employee
    operation: delete
    api: DELETE /api/employees/{employee_id}
    expected: deny
    expected_status: 403

  # ===========================================================================
  # Role Permission Tests — Employee (positive: self query, self update)
  # ===========================================================================

  - category: role_permission
    role: employee
    resource: employee
    operation: self.query
    api: GET /api/employees/{own_employee_id}
    expected: allow
    data_scope: self
    condition: "employee_id == current_user.employee_id"

  - category: role_permission
    role: employee
    resource: employee
    operation: self.update
    api: PUT /api/employees/{own_employee_id}
    expected: allow
    data_scope: self
    condition: "employee_id == current_user.employee_id"

  # ===========================================================================
  # Data Permission Tests
  # ===========================================================================

  - category: data_permission
    description: "Manager A (Engineering) can access Engineering employee"
    role: manager
    actor: manager_a
    api: GET /api/employees/{same_dept_employee_id}
    data_scope: department
    condition: "target.department == manager.department"
    expected: allow

  - category: data_permission
    description: "Manager A (Engineering) CANNOT access Marketing employee"
    role: manager
    actor: manager_a
    api: GET /api/employees/{other_dept_employee_id}
    data_scope: department
    condition: "target.department != manager.department"
    expected: deny
    expected_status: 403

  - category: data_permission
    description: "Manager A (Engineering) CANNOT list Marketing department employees"
    role: manager
    actor: manager_a
    api: GET /api/departments/{other_department_id}/employees
    data_scope: department
    expected: deny
    expected_status: 403

  - category: data_permission
    description: "Manager B (Marketing) CANNOT access Engineering employee"
    role: manager
    actor: manager_b
    api: GET /api/employees/{other_dept_employee_id}
    data_scope: department
    condition: "target.department != manager.department"
    expected: deny
    expected_status: 403

  # ===========================================================================
  # Horizontal Privilege Escalation Tests
  # ===========================================================================

  - category: horizontal_escalation
    description: "Alice CANNOT access Bob's record — same department"
    role: employee
    actor: alice
    target: bob
    api: GET /api/employees/{other_employee_id}
    expected: deny
    expected_status: 403

  - category: horizontal_escalation
    description: "Alice CANNOT update Bob's record"
    role: employee
    actor: alice
    target: bob
    api: PUT /api/employees/{other_employee_id}
    expected: deny
    expected_status: 403

  - category: horizontal_escalation
    description: "Alice CANNOT access Charlie's record — different department"
    role: employee
    actor: alice
    target: charlie
    api: GET /api/employees/{other_employee_id}
    expected: deny
    expected_status: 403

  - category: horizontal_escalation
    description: "Alice CANNOT delete Bob's record"
    role: employee
    actor: alice
    target: bob
    api: DELETE /api/employees/{other_employee_id}
    expected: deny
    expected_status: 403

  # ===========================================================================
  # Vertical Privilege Escalation Tests
  # ===========================================================================

  - category: vertical_escalation
    description: "Employee cannot perform admin delete"
    role: employee
    api: DELETE /api/employees/{employee_id}
    expected: deny
    expected_status: 403

  - category: vertical_escalation
    description: "Manager cannot perform admin delete"
    role: manager
    api: DELETE /api/employees/{employee_id}
    expected: deny
    expected_status: 403

  - category: vertical_escalation
    description: "Employee cannot create new employee (manager+ only)"
    role: employee
    api: POST /api/employees
    expected: deny
    expected_status: 403

  - category: vertical_escalation
    description: "Employee cannot list all employees (manager+ only)"
    role: employee
    api: GET /api/employees
    expected: deny
    expected_status: 403

  # ===========================================================================
  # Parameter Tampering Tests
  # ===========================================================================

  - category: parameter_tampering
    description: "Employee tampers departmentId in self-update"
    role: employee
    actor: alice
    api: PUT /api/employees/{own_employee_id}
    tampered_fields:
      departmentId: "{other_department_id}"
    expected: deny
    expected_behavior: "departmentId should be ignored or request rejected"

  - category: parameter_tampering
    description: "Employee tampers role in self-update"
    role: employee
    actor: alice
    api: PUT /api/employees/{own_employee_id}
    tampered_fields:
      role: admin
    expected: deny
    expected_behavior: "role field should be ignored or request rejected"

  - category: parameter_tampering
    description: "Employee tampers employeeId in create to impersonate"
    role: employee
    actor: alice
    api: POST /api/employees
    tampered_fields:
      employeeId: 999
      role: manager
    expected: deny
    expected_behavior: "request should be rejected (employee cannot create)"

  - category: parameter_tampering
    description: "Manager tampers departmentId to access other department"
    role: manager
    actor: manager_a
    api: GET /api/employees?departmentId={other_department_id}
    expected: deny
    expected_behavior: "should return empty or 403, not other department data"

  # ===========================================================================
  # Batch Authorization Tests
  # ===========================================================================

  - category: batch_authorization
    description: "Employee batch query with own ID + other's ID"
    role: employee
    actor: alice
    api: POST /api/employees/batch
    request_body:
      ids: ["{own_employee_id}", "{other_employee_id}"]
    expected: allow
    expected_behavior: "Only own employee data should be returned"

  - category: batch_authorization
    description: "Employee batch query with all unauthorized IDs"
    role: employee
    actor: alice
    api: POST /api/employees/batch
    request_body:
      ids: ["{other_employee_id}", "{other_dept_employee_id}"]
    expected: deny
    expected_behavior: "No data should be returned, or 403"

  - category: batch_authorization
    description: "Manager batch query with own-dept + other-dept IDs"
    role: manager
    actor: manager_a
    api: POST /api/employees/batch
    request_body:
      ids: ["{same_dept_employee_id}", "{other_dept_employee_id}"]
    expected: allow
    expected_behavior: "Only own-department employee data should be returned"
